<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Natural device scale; pinch-zoom stays enabled. viewport-fit=cover pairs with safe-area insets in CSS -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <!-- Primary Meta Tags -->
    <title>
      WorkSafe24/7 - Advanced Safety Solutions for Workforce | Tech-Enabled Life
      Safety Services
    </title>
    <meta
      name="description"
      content="Tech-Enabled Life Safety Services. Trusted Partner for employee safety. WorkSafe24/7 - Always On for workforce protection with 24/7 Safety Desk, Emergency SOS, Ambulance Service, and comprehensive employee wellbeing solutions."
    />
    <meta
      name="keywords"
      content="employee safety, workforce protection, emergency SOS, ambulance service, roadside assistance, POSH compliance, mental health support, travel safety, employee wellbeing, safety management, WorkSafe24/7"
    />

    <!-- Favicon -->
    <!-- Green-and-ivory WorkSafe 24/7 shield (vector, with PNG/ICO fallbacks) -->
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/brand/favicon-32.png"
    />
    <link rel="alternate icon" type="image/x-icon" href="/brand/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/brand/apple-touch-icon.png"
    />

    <!-- Performance Hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://play.google.com" />

    <!-- Typography: Manrope (one family for headings, body and interface; 400 / 500 / 600) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap"
    />

    <!-- Theme Color -->
    <meta name="theme-color" content="#1F5E4B" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
